# [2026-11-11 T-002] Least-privilege CI for hermes-wow-plugin. Runs every gate that does not need a
# Hermes install; `hermes plugins validate .` stays a local gate (AGENTS.md → Commands).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gate:
    name: Pytest, Ruff, Mypy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy src

      - name: Pytest with the coverage floor
        run: uv run pytest --cov=src/wow_addon_forge --cov-fail-under=85
