# [2026-11-11 T-014] Full gate on macOS and Linux, including Hermes catalog validation.
# [2026-11-11 T-051] The secrets job mirrors the Eldr repo's hardened gitleaks gate.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gate:
    name: Full gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Pytest, Ruff, and Mypy
        run: |
          uv run pytest --cov=src/wow_addon_forge --cov-fail-under=85
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: Install Hermes Agent and validate
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          uv --directory "$RUNNER_TEMP/hermes-agent" run hermes plugins validate "$GITHUB_WORKSPACE" --install-deps

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — the gate covers every commit
      - name: Scan
        # Baseline 2026-11-11: 37 commits, zero findings (see .gitleaks.toml).
        # A NEW finding is real. Image pinned by tag, not :latest — an
        # unpinned scanner is a supply-chain hole in the thing meant to
        # close supply-chain holes. Two hardening details copied from Eldr:
        # run as the checkout's uid:gid (root trips git's dubious-ownership
        # guard and gitleaks then scans 0 commits), and assert the scanned
        # count so a gate that never ran fails loudly.
        run: |
          set +e
          out=$(docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            detect --no-banner --redact -v -c .gitleaks.toml 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          scanned=$(printf '%s\n' "$out" | grep -oiE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' | head -1)
          scanned=${scanned:-0}
          if [ "$scanned" -eq 0 ]; then
            echo "::error::gitleaks scanned 0 commits — the gate did not actually run (dubious ownership?)."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks reported findings (exit $rc)."
            exit "$rc"
          fi
          echo "gitleaks: $scanned commits scanned, no leaks."
