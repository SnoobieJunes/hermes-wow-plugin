# [2026-11-11 T-002] Build, lint, format, type-check and test configuration for wow-addon-forge.
# Invariant: the ONLY runtime dependency is lupa (embedded Lua 5.1 VM, MIT). Hermes installs what
# is declared here, with the user's consent, when the plugin is installed (docs/SPEC-PLUGIN.md §12).

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "wow-addon-forge"
version = "0.1.0"
description = "Hermes Agent plugin that builds World of Warcraft: Forever addons that load and run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Auston", email = "snoobiejunes@users.noreply.github.com" },
]
# [2026-11-11 T-002] lupa 2.x bundles Lua 5.1 as lupa.lua51. The floor is the oldest line with
# that module; the upper bound keeps a future major from changing the VM under the checks.
dependencies = ["lupa>=2.1,<3"]

[dependency-groups]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wow_addon_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/wow_addon_forge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".git", ".loop", ".review", ".forge-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
# [2026-11-11 T-002] The repo root holds __init__.py (the Hermes entrypoint) and the checkout
# directory name contains hyphens, so mypy is pointed at the package explicitly.
explicit_package_bases = true
mypy_path = "src"
packages = ["wow_addon_forge"]
warn_unreachable = true

[[tool.mypy.overrides]]
# [2026-11-11 T-002] lupa ships no type stubs; its objects are typed Any at the luavm seam.
module = ["lupa", "lupa.*"]
ignore_missing_imports = true
